id: https://data.europa.eu/ers/schema/ers
name: coreSchema
description: ERS domain layer models for entity resolution
version: 0.1.0
imports:
  - linkml:types
prefixes:
  linkml: https://w3id.org/linkml/
  ers: https://data.europa.eu/ers/schema/ers/
  ere: https://data.europa.eu/ers/schema/ere/
default_prefix: ers
default_range: string

enums:

  EntityType:
    description: Types of entities that can be resolved
    permissible_values:
      ORGANISATION:
        description: An organization entity
      PROCEDURE:
        description: A procurement procedure entity

  DecisionStatus:
    description: Status of a resolution decision in the curation workflow
    permissible_values:
      AUTOMATIC_CONFIDENT:
        description: Resolution confidence exceeds threshold; no manual review required
      PENDING_MANUAL_REVIEW:
        description: Resolution confidence below threshold; awaiting curator action
      MANUALLY_REVIEWED:
        description: Curator has taken an action

  DecisionAction:
    description: Action taken on a decision by the curator
    permissible_values:
      ACCEPT_TOP:
        description: Curator accepted the top candidate
      ACCEPT_ALTERNATIVE:
        description: Curator selected an alternative candidate
      REJECT_ALL:
        description: Curator rejected all candidates

  AuditAction:
    description: Actions recorded in the audit log
    permissible_values:
      ACCEPT:
        description: Accept action performed
      REJECT:
        description: Reject action performed
      ASSIGN:
        description: Assign to alternative cluster action performed


classes:

  CanonicalEntity:
    description: |
      A logical identity construct providing a stable identity anchor.
      Represents a cluster of equivalent entity mentions.
    attributes:
      identifier:
        required: true
        description: Unique identifier for the canonical entity.
      equivalent_to:
        range: EntityMentionIdentifier
        multivalued: true
        description: Entity mentions that have been resolved to this canonical entity.

  EntityMention:
    description: |
      An entity mention is a representation of a real-world entity, as provided by the ERS.
      It contains the entity data, along with metadata like type and format.
    attributes:
      identifier:
        description: |
          The identifier (with the ERS-derived components) of the entity mention.
        range: EntityMentionIdentifier
        required: true
      content_type:
        description: |
          A string about the MIME format of `content` (e.g. text/turtle, application/ld+json)
        required: true
      content:
        description: |
          A code string representing the entity mention details (eg, RDF or XML description).
        required: true
      parsed_representation:
        description: |
          JSON representation of the parsed entity data.

  EntityMentionIdentifier:
    description: |
      A container that groups the attributes needed to identify an entity mention in a resolution request
      or response.

      As per ERS architectural decision, in the whole ERS and ERE systems, there is always a deterministic
      method to build a canonical identifier from the combination of `sourceId`, `requestId` and `entityType`
      (eg, string concatenation plus some prefix). Similarly, a cluster ID (mentioned in various places in 
      in this hereby ERE service schema) can be built from an entity that is initially the only cluster member.
    attributes:
      source_id:
        description: |
          The ID or URI of the ERS client that originated the request. This identifies an application or a 
          person accessing the ERS system.
        required: true
      request_id:
        description: |
          A string representing the unique ID of the request made to the ERS system. In general, this is unique
          only within the scope of the source and the entity type, ie, within `sourceId` and `entityType`. 
          
          Moreover, this is **not** the same as `ereRequestId`, which instead, is internal to the ERE and is 
          used to match responses to requests.
        range: string
        required: true
      entity_type:
        description: |
          A string representing the entity type (based on CET). This is typically a URI.

          Note that this is at this level, and not at `EntityMention`, since, as said above, 
          it's needed to identify the entity, even when its content is not present. For the same
          reason, it's used both for `EREResolutionRequest` and `EREResolutionResponse` messages.,
        required: true


  ClusterReference:
    description: |
      A reference to a cluster to which an entity is deemed to belong, with an associated confidence score.

      A cluster is a set of entity mentions that have been determined to refer to the same real-world entity.
      Each cluster has a unique clusterId.
      
      A cluster reference is used to report the association between an entity mention and a cluster 
      of equivalence.
    attributes:
      cluster_id:
        range: CanonicalEntity
        description: |
          The identifier of the cluster/canonical entity that is considered equivalent to the
          subject entity mention that an `EntityMentionResolutionResponse` refers to.
        required: true
      confidence_score:
        range: float
        description: |
          A 0-1 value of how confident the ERE is about the equivalence between the subject entity mention
          and the target canonical entity.
        required: true
        minimum_value: 0.0
        maximum_value: 1.0

  Decision:
    description: |
      Aggregate root representing a resolution decision requiring curation.
      Captures the state and outcome of entity mention resolution.
    attributes:
      id:
        description: Unique identifier for the decision
        required: true
      about_entity_mention:
        range: EntityMentionIdentifier
        description: Reference to the entity mention being resolved
        required: true
      status:
        range: DecisionStatus
        description: Current status in the curation workflow
        required: true
      action:
        range: DecisionAction
        description: Action taken by curator
      accepted_candidate:
        range: ClusterReference
        description: The cluster reference accepted for this entity mention
      candidates:
        range: ClusterReference
        multivalued: true
        description: All cluster references proposed by ERE, ordered by confidence
        required: true
      created_at:
        range: datetime
        description: Timestamp when the decision was created
        required: true
      updated_at:
        range: datetime
        description: Timestamp when the decision was last updated

  AuditLog:
    description: Audit trail entry for curation actions
    attributes:
      id:
        description: Unique identifier for the audit entry
        required: true
      actor:
        description: User identifier who performed the action
        required: true
      action:
        range: AuditAction
        description: The action performed
        required: true
      instance_type:
        description: Type of entity being modified (e.g., Decision)
        required: true
      instance_id:
        description: Identifier of the modified entity
        required: true
      changes:
        description: JSON representation of action-specific context
      created_at:
        range: datetime
        description: Timestamp when the action was performed
        required: true
