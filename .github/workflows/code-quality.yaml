name: Quality Check

on:
  push:
    branches: [develop, main, feature/ERS1-103/ci-setup]
    paths:
      - "src/**"
      - "resources/schemas/**"
      - "test/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "sonar-project.properties"
      - ".pylintrc"
      - "Makefile"
      - ".github/workflows/code-quality.yaml"
  pull_request:
    paths:
      - "src/**"
      - "resources/schemas/**"
      - "test/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "sonar-project.properties"
      - ".pylintrc"
      - "Makefile"
      - ".github/workflows/code-quality.yaml"

jobs:
  quality:
    name: Lint, Build & Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: make install

      - name: Run Pylint with report
        id: pylint
        continue-on-error: true
        run: |
          make lint-report
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Check if report exists
        id: check_report
        run: |
          if [ -f pylint_report.txt ]; then
            echo "report_exists=true" >> $GITHUB_OUTPUT
            cat pylint_report.txt
          else
            echo "report_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish Pylint Comment
        if: always() && github.event_name == 'pull_request' && steps.check_report.outputs.report_exists == 'true'
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: pylint_report.txt
          comment-tag: pylint

      - name: Generate models and docs
        run: make all

      - name: Verify generated code is up to date
        id: verify_generated_code
        run: |
          echo "Checking if generated files match LinkML schemas..."
          if ! git diff --quiet src/ resources/schemas/; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Generated code is out of sync!"
            git diff --stat src/ resources/schemas/
            exit 1
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Generated code is up to date"
          fi

      - name: Comment on PR about out-of-sync code
        if: failure() && github.event_name == 'pull_request' && steps.verify_generated_code.outputs.has_changes == 'true'
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            ## Generated Code Out of Sync with LinkML Schemas

            The generated files in `src/` and/or `resources/schemas/` are out of sync with the LinkML source schema.

            **To fix this locally:**
            ```bash
            make all
            git add src/ resources/schemas/ docs/schema/
            git commit -m "chore: regenerate models from LinkML schemas"
            git push
            ```
          comment-tag: generated_code_check

      - name: Comment on PR that generated code is in sync
        if: success() && github.event_name == 'pull_request' && steps.verify_generated_code.outputs.has_changes == 'false'
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            ## Generated Code is in Sync with LinkML Schemas

            The Python models, JSON Schema, and documentation are up to date with the LinkML source schema.
          comment-tag: generated_code_check

      - name: Upload coverage reports to Codecov
        if: hashFiles('coverage.xml') != '' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
