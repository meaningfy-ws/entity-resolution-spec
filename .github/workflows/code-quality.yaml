name: Quality Check

on:
  push:
    branches: [develop, main]
    paths:
      - "src/**"
      - "resources/schemas/**"
      - "test/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "sonar-project.properties"
      - ".pylintrc"
      - "Makefile"
      - ".github/workflows/code-quality.yaml"
  pull_request:
    paths:
      - "src/**"
      - "resources/schemas/**"
      - "test/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "sonar-project.properties"
      - ".pylintrc"
      - "Makefile"
      - ".github/workflows/code-quality.yaml"

jobs:
  quality:
    name: Lint, Build & Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: make install

      - name: Run Pylint with report
        id: pylint
        continue-on-error: true
        run: |
          make lint-report
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Check if report exists
        id: check_report
        run: |
          if [ -f pylint_report.txt ]; then
            echo "report_exists=true" >> $GITHUB_OUTPUT
            cat pylint_report.txt
          else
            echo "report_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish Pylint Comment
        if: always() && github.event_name == 'pull_request' && steps.check_report.outputs.report_exists == 'true'
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: pylint_report.txt
          comment-tag: pylint

      - name: Generate models
        run: make generate-models

      - name: Verify generated code is up to date
        id: verify_generated_code
        run: |
          echo "Checking if generated files match LinkML schemas..."
          if ! git diff --quiet src/ resources/schemas/; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Generated code is out of sync!"
            git diff --stat src/ resources/schemas/
            exit 1
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Generated code is up to date"
          fi

      - name: Run tests
        run: make test

      - name: Upload coverage reports to Codecov
        if: hashFiles('coverage.xml') != '' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != '' && vars.SONAR_PROJECT_KEY != ''
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
