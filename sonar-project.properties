# Project key and organization are passed via GitHub Actions variables
# to allow reuse across forks (meaningfy-ws, OP-TED, etc.)

sonar.projectName=Entity Resolution Spec
sonar.projectVersion=0.0.1

sonar.sources=src
sonar.tests=test

sonar.sourceEncoding=UTF-8
sonar.python.version=3.14

sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Exclude generated code from analysis
sonar.exclusions=src/ere/models/core.py,docs/**/*,*.md,resources/**/*

# Exclude test files from coverage analysis
sonar.coverage.exclusions=test/**/*

# Exclude test files from duplication detection
sonar.cpd.exclusions=test/**/*

sonar.branch.autoconfig.disabled=false
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
